name: BungeeGuard
version: ${project.version}
description: Token-based backend protection with Floodgate, Geyser, and Education Edition compatibility.
authors: [Luck, NickUC]
load: STARTUP

main: me.lucko.bungeeguard.spigot.BungeeGuardBackendPlugin
softdepend: [ProtocolLib, floodgate]
api-version: 1.13
folia-supported: true

commands:
  bungeeguard:
    description: Reloads the configuration
    permission: bungeeguard.reload
    usage: /bungeeguard reload